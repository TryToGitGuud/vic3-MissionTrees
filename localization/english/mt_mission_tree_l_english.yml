 mt_fra_political_m09:0 "The Elder\nBranch"
 mt_fra_political_m09_tt:0 "#header The Elder Branch#!\n$TOOLTIP_DELIMITER$\nResolve the Bourbon question according to the decision taken after the Clerical Compact."
 mt_fra_political_m09_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_m06$#! and take either #bold $mt_fra_isolate_legitimists$#! or #bold $mt_fra_alliance_with_legitimists$#!."
 mt_fra_political_m10:0 "Army of the\nNation"
 mt_fra_political_m10_tt:0 "#header Army of the Nation#!\n$TOOLTIP_DELIMITER$\nMake military prestige the base of a new Caesarism."
 mt_fra_political_m10_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_m07$#!."
 mt_fra_political_m11:0 "Balance the\nChambers"
 mt_fra_political_m11_tt:0 "#header Balance the Chambers#!\n$TOOLTIP_DELIMITER$\nBring all three royal currents inside an order none can dominate."
 mt_fra_political_m11_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete all three factional paths."
 mt_fra_political_m12:0 "Cement the\nDynasty"
 mt_fra_political_m12_tt:0 "#header Cement the Dynasty#!\n$TOOLTIP_DELIMITER$\nThe victorious house must now acquire capable allies."
 mt_fra_political_m12_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_m11$#! and finish #bold Cement the Rightful Dynasty#! ."
 mt_fra_political_m13:0 "Crown and\nCharter"
 mt_fra_political_m13_tt:0 "#header Crown and Charter#!\n$TOOLTIP_DELIMITER$\nMake the crown an institution that can endure."
 mt_fra_political_m13_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_m12$#!."
 mt_fra_political_m14:0 "Dynastic\nAmbition"
 mt_fra_political_m14_tt:0 "#header Dynastic Ambition#!\n$TOOLTIP_DELIMITER$\nTeach ruler and heir that survival is only a beginning."
 mt_fra_political_m14_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_m13$#!."
 mt_fra_political_m15:0 "The French\nSettlement"
 mt_fra_political_m15_tt:0 "#header The French Settlement#!\n$TOOLTIP_DELIMITER$\nA monarchist France has survived its own quarrels."
 mt_fra_political_m15_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_m14$#!."

 mt_fra_political_r01:0 "Provisional\nGovernment"
 mt_fra_political_r01_tt:0 "#header Provisional Government#!\n$TOOLTIP_DELIMITER$\nThe monarchy has fallen. Give the new republic authority to survive."
 mt_fra_political_r01_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nFrance is not a [concept_monarchy]."
 mt_fra_political_r02:0 "National\nWorkshops"
 mt_fra_political_r02_tt:0 "#header National Workshops#!\n$TOOLTIP_DELIMITER$\nAnswer the social republic's first demand: work."
 mt_fra_political_r02_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r01$#! ."
 mt_fra_political_r03:0 "Constituent\nAssembly"
 mt_fra_political_r03_tt:0 "#header Constituent Assembly#!\n$TOOLTIP_DELIMITER$\nWrite institutions able to outlive the emergency."
 mt_fra_political_r03_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r01$#! ."
 mt_fra_political_r04:0 "The Party\nof Order"
 mt_fra_political_r04_tt:0 "#header The Party of Order#!\n$TOOLTIP_DELIMITER$\nReassure those who fear disorder."
 mt_fra_political_r04_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r02$#! ."
 mt_fra_political_r05:0 "Republic of\nProperty"
 mt_fra_political_r05_tt:0 "#header Republic of Property#!\n$TOOLTIP_DELIMITER$\nBind commercial France to the republic."
 mt_fra_political_r05_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r03$#! ."
 mt_fra_political_r06:0 "The Red\nSpectre"
 mt_fra_political_r06_tt:0 "#header The Red Spectre#!\n$TOOLTIP_DELIMITER$\nPreserve order without abandoning the republic."
 mt_fra_political_r06_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r04$#! ."
 mt_fra_political_r07:0 "Universal\nSuffrage"
 mt_fra_political_r07_tt:0 "#header Universal Suffrage#!\n$TOOLTIP_DELIMITER$\nTurn a revolutionary right into ordinary French politics."
 mt_fra_political_r07_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r05$#! ."
 mt_fra_political_r08:0 "Republic\nConsolidated"
 mt_fra_political_r08_tt:0 "#header Republic Consolidated#!\n$TOOLTIP_DELIMITER$\nThe republic has outlasted its founding crisis."
 mt_fra_political_r08_conditions_tt:0 "#header Completion Conditions#!\n$TOOLTIP_DELIMITER$\nComplete #bold $mt_fra_political_r06$#! and #bold $mt_fra_political_r07$#! ."

 mt_fra_monarchist_public_acclaim:0 "Public Acclaim"
 mt_fra_monarchist_public_acclaim_desc:0 "The settlement of the dynastic crisis has turned this leader into a public symbol of the restored order."

 mt_french_missions.1.t:0 "The Dynasty Acclaimed"
 mt_french_missions.1.d:0 "With the succession question settled, the public figures who defended the victorious dynasty have acquired a new authority in French political life."
 mt_french_missions.1.f:0 ""The chamber may argue, the press may complain, but the country has chosen its house.""
 mt_french_missions.1.a:0 "Let the new order speak for itself."

 mt_fra_july_monarchy_placeholder:0 "The July Monarchy"
 mt_fra_july_monarchy_placeholder_desc:0 "The constitutional throne has found a firmer voice in the institutions of the state."
 mt_fra_national_guard_placeholder:0 "National Guard Reorganized"
 mt_fra_national_guard_placeholder_desc:0 "The citizen soldiers of France are prepared to defend the constitutional order."
 mt_fra_balance_chambers_placeholder:0 "Balance of the Chambers"
 mt_fra_balance_chambers_placeholder_desc:0 "A careful parliamentary settlement gives the government room to act."
 mt_fra_french_settlement_placeholder:0 "The French Settlement"
 mt_fra_french_settlement_placeholder_desc:0 "The country recognizes that its constitutional quarrel has reached a durable conclusion."

 mt_french_missions.2.t:0 "The July Monarchy"
 mt_french_missions.2.d:0 "In the ministries, the chambers, and the guarded streets of Paris, the constitutional monarchy has begun to look less like an improvisation and more like a regime."
 mt_french_missions.2.f:0 "\"A crown must be seen to govern, or it is only a memory.\""
 mt_french_missions.2.a:0 "Let the charter endure."
 mt_french_missions.3.t:0 "The National Guard Assembles"
 mt_french_missions.3.d:0 "Shopkeepers, clerks, and veterans answer the roll. Their service binds the defense of the city to the defense of the constitutional throne."
 mt_french_missions.3.f:0 "\"Order is strongest when citizens themselves keep watch over it.\""
 mt_french_missions.3.a:0 "Paris shall stand ready."
 mt_french_missions.4.t:0 "A Balance in the Chambers"
 mt_french_missions.4.d:0 "No faction is strong enough to dictate alone. A settlement between the benches gives the government a rare chance to govern before the old quarrels return."
 mt_french_missions.4.f:0 "\"A chamber is not conquered; it is counted.\""
 mt_french_missions.4.a:0 "Preserve the equilibrium."
 mt_french_missions.5.t:0 "The French Settlement"
 mt_french_missions.5.d:0 "Years of pamphlets, processions, and anxious bargaining have ended in a France prepared to accept its constitutional order. The work now is to make that peace respected."
 mt_french_missions.5.f:0 "\"France has argued enough. Let her now build.\""
 mt_french_missions.5.a:0 "The settlement holds."

 mt_fra_placate_legitimists:0 "Placate the Legitimists"
 mt_fra_placate_legitimists_desc:0 "Open a controlled accommodation with the Legitimist movement. This decision can only be taken once."
 mt_fra_isolate_legitimists:0 "Isolate the Legitimists"
 mt_fra_isolate_legitimists_desc:0 "Keep the Legitimists outside the settlement and contain their influence. This decision determines the Elder Branch reward."
 mt_fra_alliance_with_legitimists:0 "Alliance with the Legitimists"
 mt_fra_alliance_with_legitimists_desc:0 "Bring the Legitimists into the settlement as organized allies. This decision determines the Elder Branch reward."

 mt_fra_unlock_placate_legitimists_tt:0 "Unlocks the #bold $mt_fra_placate_legitimists$#! Decision."
 mt_fra_unlock_isolate_legitimists_tt:0 "Unlocks the #bold $mt_fra_isolate_legitimists$#! Decision."
 mt_fra_unlock_alliance_legitimists_tt:0 "Unlocks the #bold $mt_fra_alliance_with_legitimists$#! Decision."
 mt_fra_legitimist_progress_decrease_40_tt:0 "#bold Decreases#! the #bold Progress#! of the #bold Legitimists#! by #variable 40#!"

 mt_fra_legitimist_placated:0 "Legitimists Placated"
 mt_fra_legitimist_placated_desc:0 "The Legitimist movement has accepted a temporary accommodation with the constitutional order."
 mt_fra_devout_legitimist_favor:0 "Legitimist Favor"
 mt_fra_devout_legitimist_favor_desc:0 "The Devout welcome the public recognition granted to the Legitimist cause."
 mt_fra_devout_legitimist_displeasure:0 "Legitimist Displeasure"
 mt_fra_devout_legitimist_displeasure_desc:0 "The Devout resent the government's decision to rebuff the Legitimist cause."
 mt_fra_legitimist_state_religion_support:0 "State Religion Legitimism"
 mt_fra_legitimist_state_religion_support_desc:0 "The union of altar and state has strengthened the appeal of the Legitimist movement."
 mt_fra_legitimist_secular_setback:0 "Legitimist Secular Setback"
 mt_fra_legitimist_secular_setback_desc:0 "The rejection of a confessional settlement has weakened the appeal of the Legitimist movement."
 mt_fra_legitimist_royalist_discredit:0 "Legitimist Discredited"
 mt_fra_legitimist_royalist_discredit_desc:0 "This former Legitimist has been forced into a broader Royalist position at considerable personal cost."

 mt_french_missions.6.t:0 "Terms for the White Flag"
 mt_french_missions.6.d:0 "The old families will accept a place in the constitutional order, but not at any price. Their clergy and provincial allies wait to see whether the ministry will give the white flag a future or merely a museum case."
 mt_french_missions.6.f:0 "\"A dynasty may survive in exile; a cause survives only when someone is still willing to speak its name.\""
 mt_french_missions.6.a:0 "Make a generous accommodation."
 mt_french_missions.6.b:0 "Offer a measured recognition."
 mt_french_missions.6.c:0 "The white flag belongs to the past."

 mt_french_missions.7.t:0 "Deal with the Legitimists"
 mt_french_missions.7.d:0 "The Clerical Compact has made the Legitimists impossible to ignore. They can be contained at the edge of public life, or brought into the settlement under conditions of our choosing."
 mt_french_missions.7.f:0 "\"They ask for a throne. We must decide whether to give them a chair, or leave them standing in the corridor.\""
 mt_french_missions.7.a:0 "Keep them at arm's length."
 mt_french_missions.7.b:0 "Offer them a place in the settlement."

 mt_fra_convene_council_of_state:0 "Convene the Council of State"
 mt_fra_convene_council_of_state_desc:0 "A future midgame decision for reorganizing the machinery of the French state."
 mt_fra_reform_the_prefectures:0 "Reform the Prefectures"
 mt_fra_reform_the_prefectures_desc:0 "A future midgame decision for extending the reach of the central government."
 mt_fra_proclaim_national_reconciliation:0 "Proclaim National Reconciliation"
 mt_fra_proclaim_national_reconciliation_desc:0 "A future midgame decision for consolidating the French political settlement."

 decree_mt_fra_prefectural_administration:0 "Prefectural Administration"
 decree_mt_fra_prefectural_administration_desc:0 "A provisional administrative program to coordinate public works through the prefectures."
 decree_mt_fra_civic_guard_patrols:0 "Civic Guard Patrols"
 decree_mt_fra_civic_guard_patrols_desc:0 "A provisional deployment of citizen guards to keep order in the departments."
 decree_mt_fra_departmental_survey:0 "Departmental Survey"
 decree_mt_fra_departmental_survey_desc:0 "A provisional survey of local roads, populations, and administrative needs."

